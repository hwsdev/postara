; PHP-FPM pool configuration for Postara
; Deploy to: /etc/php/8.3/fpm/pool.d/www.conf
;
; Formula for pm.max_children:
;   Available RAM for PHP / avg memory per process
;   Check avg: ps --no-headers -o "rss,cmd" -C php-fpm8.3 | awk '{sum+=$1} END {print sum/NR/1024 " MB"}'
;
; VPS sizing guide:
;   1 GB RAM  → max_children 5,  start 2, min_spare 1, max_spare 3
;   2 GB RAM  → max_children 10, start 3, min_spare 2, max_spare 5
;   4 GB RAM  → max_children 20, start 5, min_spare 3, max_spare 8
;   8 GB RAM  → max_children 40, start 8, min_spare 4, max_spare 12

[www]
user = www-data
group = www-data

; Unix socket — faster than TCP for same-host Nginx
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ── Process manager ───────────────────────────────────────────────────────────
; dynamic: spawn workers on demand, keep min alive
pm = dynamic

; TUNE THIS based on your RAM (see formula above)
; Default below is for 2 GB VPS
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle workers after N requests to prevent memory leaks
pm.max_requests = 500

; Kill idle workers after 10s to free RAM
pm.process_idle_timeout = 10s

; ── Timeouts ──────────────────────────────────────────────────────────────────
request_terminate_timeout = 300
request_slowlog_timeout = 10s
slowlog = /var/log/php/php8.3-fpm-slow.log

; ── Logging ───────────────────────────────────────────────────────────────────
access.log = /var/log/php/php8.3-fpm-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}Mk"

; ── Environment ───────────────────────────────────────────────────────────────
clear_env = no

; ── Status / ping (for monitoring) ───────────────────────────────────────────
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
