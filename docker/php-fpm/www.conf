; PHP-FPM pool configuration for Postara

[www]
user = www-data
group = www-data

; Listen on TCP socket (Nginx connects to app:9000)
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Pass environment variables to PHP
clear_env = no

; Status page (accessible from Nginx for monitoring)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
