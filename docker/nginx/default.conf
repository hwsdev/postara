server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    # Uncomment if you're terminating TLS at Nginx (not at Traefik/Coolify).
    # If using Coolify or an external reverse proxy, leave this commented out
    # and let the proxy handle HTTPS.
    #
    # return 301 https://$host$request_uri;

    root /app/public;
    index index.php;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static assets — long cache ────────────────────────────────────────────
    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Laravel build assets (Vite) ───────────────────────────────────────────
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ── Main Laravel entry point ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Pass real IP from upstream proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # ── Block access to sensitive files ──────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.(env|log|htaccess|gitignore)$ {
        deny all;
    }
}

# ── HTTPS server (standalone, no external proxy) ──────────────────────────────
# Uncomment this block if you're running Nginx as the TLS terminator directly
# (i.e. NOT behind Coolify/Traefik/Caddy). Provide your own certs.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name mail.yourdomain.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#
#     root /app/public;
#     index index.php;
#
#     # ... same location blocks as above ...
# }
