name: Bug report
description: Something is broken
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: Postara version
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "e.g. 8.3.6"

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Coolify
        - Docker Compose (standalone)
        - Local development
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
