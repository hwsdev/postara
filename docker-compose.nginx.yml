# docker-compose.nginx.yml
#
# Nginx + PHP-FPM variant for self-hosted deployments without Coolify.
# Use this if you prefer Nginx over FrankenPHP/Caddy.
#
# Usage:
#   cp .env.example .env   # fill in APP_KEY, POSTGRES_PASSWORD, APP_URL
#   docker compose -f docker-compose.nginx.yml up -d
#   docker compose -f docker-compose.nginx.yml exec app php artisan migrate --force
#
# Then open http://your-server-ip/setup

services:

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro          # serve static assets directly
      - nginx-logs:/var/log/nginx
      # Uncomment to use your own TLS certs:
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PHP-FPM application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      APP_NAME: Postara
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postara
      DB_USERNAME: postara
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Queue worker ──────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postara
      DB_USERNAME: postara
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postara
      DB_USERNAME: postara
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postara
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postara"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  app-storage:
  nginx-logs:
