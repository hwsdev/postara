services:
  app:
    image: ghcr.io/hwsdev/postara-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: Postara
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${SERVICE_FQDN_APP:-http://localhost}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postara
      DB_USERNAME: postara
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      MAIL_MAILER: smtp
      MAIL_HOST: ${SMTP_HOST:-127.0.0.1}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USER:-null}
      MAIL_PASSWORD: ${SMTP_PASSWORD:-null}
      MAIL_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: Postara
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"

  queue-worker:
    image: ghcr.io/hwsdev/postara-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postara
      DB_USERNAME: postara
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      MAIL_MAILER: smtp
      MAIL_HOST: ${SMTP_HOST:-127.0.0.1}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USER:-null}
      MAIL_PASSWORD: ${SMTP_PASSWORD:-null}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    image: ghcr.io/hwsdev/postara-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: postara
      DB_USERNAME: postara
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postara
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postara"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
